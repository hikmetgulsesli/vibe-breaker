<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-Breaker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- In-Game HUD -->
        <div id="game-hud" class="hud hidden">
            <div class="hud-header">
                <div class="hud-score-section">
                    <span class="hud-label">HIGH SCORE</span>
                    <span class="hud-value" id="hud-high-score">000000</span>
                </div>
                <div class="hud-score-section hud-score-right">
                    <span class="hud-label hud-label-primary">SCORE</span>
                    <span class="hud-value hud-value-large" id="hud-score">000000</span>
                </div>
            </div>
            <div class="hud-controls">
                <span class="hud-control-hint">
                    <span class="material-symbols-outlined">keyboard_arrow_up</span> JUMP
                </span>
                <span class="hud-divider">|</span>
                <span class="hud-control-hint">
                    <span class="material-symbols-outlined">keyboard_arrow_down</span> DUCK
                </span>
            </div>
        </div>

        <!-- Start Screen - Stitch Design Implementation -->
        <div id="start-screen" class="screen">
            <!-- Logo Icon -->
            <div class="logo-container">
                <span class="logo-icon material-symbols-outlined">sports_esports</span>
            </div>

            <!-- Main Content -->
            <div class="content">
                <!-- Title -->
                <h1 class="neon-text">VIBE-BREAKER</h1>

                <!-- High Score Display -->
                <div class="high-score-display">
                    <p>HIGH SCORE: <span class="score-value" id="start-high-score">000000</span></p>
                </div>

                <!-- Start Instruction -->
                <div class="start-instruction">
                    <h2 class="pulse">
                        PRESS <span class="key-highlight">SPACE</span> TO START
                    </h2>
                </div>
            </div>

            <!-- Footer -->
            <footer>
                <p>&copy; 2024 VIBE-BREAKER STUDIOS</p>
            </footer>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>

            <div class="score-section">
                <div class="score-card">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="final-score">0</span>
                </div>

                <div class="score-card high-score">
                    <span class="score-label">High Score</span>
                    <span class="score-value" id="game-over-high-score">0</span>
                </div>
            </div>

            <p id="new-high-score-badge" class="hidden">NEW HIGH SCORE!</p>

            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Game Script -->
    <script src="game.js"></script>
</body>
</html>
